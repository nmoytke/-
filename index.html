<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ITO MIYUKI — Illustrator</title>
  <meta name="description" content="Illustrator ITO MIYUKI">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <a href="/" class="logo">ITO MIYUKI</a>

    <nav>
      <a href="#works">WORKS</a>
      <a href="#about">ABOUT</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>


  <!-- MAIN -->
  <main>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-text">
        <p>Illustrator</p>
        <h1>ITO MIYUKI</h1>
      </div>

      <div class="hero-image">
        <img src="images/main.jpg" alt="Illustration by ITO MIYUKI">
      </div>
    </section>


    <!-- WORKS -->
    <section id="works" class="works">

      <div class="section-title">
        <span>01</span>
        <h2>WORKS</h2>
      </div>

      <div class="works-grid">

        <a href="#" class="work work-large">
          <img src="images/work01.jpg" alt="">
          <div class="work-info">
            <p>BOOK</p>
            <h3>作品タイトル</h3>
          </div>
        </a>

        <a href="#" class="work">
          <img src="images/work02.jpg" alt="">
          <div class="work-info">
            <p>ILLUSTRATION</p>
            <h3>作品タイトル</h3>
          </div>
        </a>

        <a href="#" class="work">
          <img src="images/work03.jpg" alt="">
          <div class="work-info">
            <p>MAGAZINE</p>
            <h3>作品タイトル</h3>
          </div>
        </a>

        <a href="#" class="work work-large">
          <img src="images/work04.jpg" alt="">
          <div class="work-info">
            <p>WEB</p>
            <h3>作品タイトル</h3>
          </div>
        </a>

      </div>

    </section>


    <!-- ABOUT -->
    <section id="about" class="about">

      <div class="section-title">
        <span>02</span>
        <h2>ABOUT</h2>
      </div>

      <div class="about-content">
        <p class="about-name">
          ITO MIYUKI<br>
          Illustrator
        </p>

        <p>
          イラストレーター<br>
          いとうみゆき
        </p>

        <p>
          書籍・雑誌・Webなどを中心に<br>
          イラストレーションを制作しています。
        </p>
      </div>

    </section>


    <!-- CONTACT -->
    <section id="contact" class="contact">

      <div class="section-title">
        <span>03</span>
        <h2>CONTACT</h2>
      </div>

      <a href="mailto:your@email.com" class="email">
        your@email.com
      </a>

    </section>

  </main>


  <!-- FOOTER -->
  <footer>
    <p>© ITO MIYUKI</p>
  </footer>

</body>
</html>
